[project]
name = "ha-shelly-elevate"
version = "0.1.0"
description = "Home Assistant integration for Shelly Wall Displays running ShellyElevate"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
